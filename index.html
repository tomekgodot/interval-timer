<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f3f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Interval Timer">

  <!--
    Security policy for the web build:
    - no inline JavaScript
    - no third-party scripts
    - no network API calls
    - no framing
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self';
                 style-src 'self';
                 img-src 'self' data:;
                 media-src 'self';
                 connect-src 'none';
                 object-src 'none';
                 base-uri 'self';
                 form-action 'none'">

  <title>Interval Timer</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-180.png">
</head>

<body>
  <main class="app">
    <header class="app-header">
      <h1>⏱️ Interval Timer</h1>
      <p>Twój trening interwałowy</p>
    </header>

    <section class="card timer-card" aria-labelledby="timerHeading">
      <div id="timerHeading" class="label">AKTUALNY INTERWAŁ</div>
      <div id="timer" aria-live="polite">--</div>

      <div class="label">POZOSTAŁO</div>
      <div id="remainingTime">00:00</div>
      <div id="status" aria-live="polite">Gotowy</div>

      <div class="buttons">
        <button id="startButton" class="start" type="button">▶ START</button>
        <button id="pauseButton" class="pause" type="button">⏸ PAUZA</button>
        <button id="stopButton" class="stop" type="button">⏹ STOP</button>
      </div>
    </section>

    <section class="card" aria-labelledby="workoutHeading">
      <div class="training-name">
        <label for="trainingName">NAZWA TRENINGU</label>
        <input
          id="trainingName"
          type="text"
          maxlength="80"
          autocomplete="off"
          placeholder="np. Workout A">
        <button id="saveWorkoutButton" class="save-button" type="button">
          💾 ZAPISZ TRENING
        </button>
      </div>

      <div class="training-header">
        <h2 id="workoutHeading">Trening</h2>
        <div class="repeat-box">
          <label for="trainingRepeats">Powtórz cały trening:</label>
          <input id="trainingRepeats" type="number" min="1" max="100" value="3" inputmode="numeric">
        </div>
      </div>

      <div id="sections"></div>

      <button id="addSectionButton" class="add-section" type="button">
        ＋ DODAJ SEKCJĘ
      </button>

      <div class="saved-title">ZAPISANE TRENINGI</div>
      <div id="savedWorkouts"></div>
    </section>

    <p class="web-note">
      Wersja webowa. Na iPhonie możesz dodać ją do ekranu początkowego z menu Udostępnij.
    </p>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
